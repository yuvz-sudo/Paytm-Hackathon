# Optional Postgres for parity with the deck's stack. The app runs fine on SQLite without it.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: dukaan, POSTGRES_PASSWORD: dukaan, POSTGRES_DB: dukaan }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
